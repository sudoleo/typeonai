name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-integration:
    name: Unit and integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Prepare test reports
        run: mkdir -p test-results
      - name: Run regular suite (E2E excluded)
        env:
          RUN_E2E: "0"
        run: python -m pytest tests -q --junitxml=test-results/unit-integration.xml
      - name: Upload regular test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-integration-results
          path: test-results/unit-integration.xml
          if-no-files-found: error

  e2e-firestore-emulator:
    name: E2E (Firestore emulator)
    needs: unit-integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            requirements-e2e.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install test tools
        run: |
          python -m pip install -r requirements-e2e.txt
          python -m playwright install --with-deps chromium
          npm install --global firebase-tools@13.35.1
          mkdir -p test-results
      - name: Run isolated browser suite
        env:
          RUN_E2E: "1"
          E2E_TEST_MODE: "1"
          FIRESTORE_EMULATOR_HOST: "127.0.0.1:8085"
          GOOGLE_CLOUD_PROJECT: demo-consensio-e2e
          GCLOUD_PROJECT: demo-consensio-e2e
          FIREBASE_PROJECT_ID: demo-consensio-e2e
        run: >-
          firebase emulators:exec --only firestore --project demo-consensio-e2e
          "python -m pytest tests/e2e -q --junitxml=test-results/e2e.xml"
      - name: Upload E2E test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results/e2e.xml
          if-no-files-found: error
